<section id="projects">
  <div class="section-head" appRevealOnScroll>
    <span class="idx">03</span>
    <h2>Projects tested</h2>
    <div class="section-rule"></div>
  </div>

  <div class="projects">
    <div class="project" *ngFor="let p of projects" appRevealOnScroll>
      <div>
        <span class="project-name"
          >{{ p.name }}<span class="project-type">{{ p.type }}</span></span
        >
      </div>
      <p>{{ p.description }}</p>
    </div>
  </div>
</section>
