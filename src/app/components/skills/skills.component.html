<section id="skills">
  <div class="section-head" appRevealOnScroll>
    <span class="idx">02</span>
    <h2>Skill coverage</h2>
    <div class="section-rule"></div>
  </div>

  <div class="skill-groups">
    <div class="skill-group" *ngFor="let group of groups" appRevealOnScroll>
      <h3>{{ group.title }}</h3>
      <div class="chips">
        <span class="chip" *ngFor="let chip of group.chips">{{ chip }}</span>
      </div>
    </div>
  </div>
</section>
